[package]
name = "wayhint"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"            # the oldest Rust that builds this; 2024 edition needs 1.85
description = "Keyboard hints for everything clickable on a Wayland desktop"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tkutsu/wayhint"
readme = "README.md"
keywords = ["wayland", "keyboard", "accessibility", "hints", "hyprland"]
categories = ["command-line-utilities", "accessibility"]

[dependencies]
anyhow = "1.0.104"
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "wrappers", "tokio"] }  # no p2p: it dials every app at startup
calloop = { version = "0.14", features = ["signals"] }  # only to turn on SCTK's calloop signals: Ctrl+C as an event
clap = { version = "4.6.7", features = ["derive"] }
fontdue = "0.9"
futures = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = "0.21"
tiny-skia = "0.11"
tokio = { version = "1", features = ["rt", "macros", "time"] }
toml = "1.1.8"
xkbcommon = { version = "0.8", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
proptest = "1"
