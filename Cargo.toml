[package]
name = "wayhint"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"            # the oldest Rust that builds this: let-chains (`if let .. && let ..`) need 1.88
description = "Keyboard hints for everything clickable on a Wayland desktop"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tkutsu/wayhint"
readme = "README.md"
keywords = ["wayland", "keyboard", "accessibility", "hints", "hyprland"]
categories = ["command-line-utilities", "accessibility"]

[dependencies]
anyhow = "1.0.104"
bitflags = "2"  # already in the tree through wayland: the window export's generated code names it
atspi = { version = "0.30", default-features = false, features = ["proxies", "wrappers", "tokio"] }
atspi-connection = { version = "0.14", default-features = false, features = ["wrappers"] }  # not through atspi's `connection`, which turns on p2p: that dials every app at startup, and one dead app fails the connection
calloop = { version = "0.14", features = ["signals"] }  # only to turn on SCTK's calloop signals: Ctrl+C as an event
clap = { version = "4.6.7", features = ["derive"] }
fontdue = "0.9"
futures = "0.3"
rustix = { version = "1.1", features = ["event", "fs", "net", "time"] }  # already in the tree through wayland: `time` for the clock input events are stamped with, `fs` for the memfds a keymap and a window picture travel in, `event` to wait for a picture with a deadline, `net` to dial the input box's listener without waiting
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = "0.21"
tiny-skia = "0.11"
tokio = { version = "1", features = ["rt", "macros", "time"] }
toml = "1.1.8"
unicode-normalization = "0.1.26"  # text mode: splits é into e and its accent, so the accent can be dropped
wayland-scanner = "0.31"  # already in the tree through wayland: writes the client code for Hyprland's window export from its XML
xkbcommon = { version = "0.8", default-features = false }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[dev-dependencies]
png = "0.18"  # the pixel tests read saved captures
proptest = "1"
