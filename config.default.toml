# wayhint's default config.
#
# Every setting below is shown at its default, commented out. Copy this file
# to ~/.config/wayhint/config.toml and uncomment only what you change:
#
#     wayhint config --default > ~/.config/wayhint/config.toml
#
# `wayhint config` prints the settings in effect: your file merged with
# these defaults. It also checks your file: a misspelt setting or a bad
# value is an error that names it, and wayhint itself stops on it before
# taking the keyboard, so a typo can never leave you stuck. `wayhint doctor`
# checks the rest of the setup.
#
# Colours are "#RGB", "#RGBA", "#RRGGBB" or "#RRGGBBAA"; A is opacity.
# Sizes and distances are logical px.


[keys]
# Keys are matched by position, read with your keyboard's first layout, and
# written here as that layout prints them. The defaults below are what a US
# layout prints; on another layout they are the same positions.

# Tag letters, easiest to press first. Easy letters carry repeated prefixes;
# short tags come first. The default is your home row.
# alphabet = "asdfghjkl"

# The verbs. Type one anywhere before a tag's last letter to do it there
# instead of a left click, before Space to do it at the pointer, or twice to
# do it again where the last command was (PageDown PageDown scrolls the same
# pane again). In text mode, type it before any text; a named key works
# there any time, and a key that types a letter or digit is always text.
# A key is one character, Shift included ("_"), or a name:
# PageUp, PageDown, Home, End, Delete.
# "" makes a verb what a bare tag does; exactly one verb is "".
# A key a verb takes leaves the alphabet. A default key that is one of your
# tag letters, or that you gave another command, is simply left unbound.
# left = ""                 # left click: a bare tag does this
# right = ","               # right click
# middle = "/"              # middle click
# double = "."              # double click
# hover = "'"               # move there and stay, for tooltips
# back = "Home"             # the mouse's back button
# forward = "End"           # the mouse's forward button
# scroll_up = "PageUp"      # the wheel up, [pointer] scroll notches
# scroll_down = "PageDown"  # the wheel down, [pointer] scroll notches
# hold = ";"                # press and keep down; the next tag or Space lets go there (a drag), the close key lets go in place

# Commands of their own.
# repeat = ""               # the last command again, on the same target; "" for none
# help = "?"                # every key and what it does, in the info box; "" for none
# close = "Esc"             # leave wayhint, from tags or text mode; while holding, release in place first
# The close key takes its letter out of the alphabet. It can be a character
# ("q", "?") or a name ("Esc", "F1" through "F24", "Space", "Home"). It
# overrides a built-in key and also closes text mode, so its character
# cannot be searched there. Launching wayhint again in the same mode closes
# it too; the other mode's launch closes it and starts that mode.

# Built in, unless chosen as the close key: Backspace takes back the last
# key, Space acts at the pointer, Enter confirms a completed tag or text
# match, Tab works in text mode, and the arrows move where a click lands,
# held for faster.

# Other keys that type a tag letter, for a layer that sends a different
# character from the same key: "key" = "letter".
# [keys.aliases]
# ";" = "c"


[hints]
# Completed tags, in tag mode and on text mode's targets with no text.
# auto_accept = true        # false waits for Enter after the whole tag; modifiers on Enter apply to the action


[style]
# How a tag looks.
# font = "sans-serif:bold"  # a fontconfig pattern, as fc-match takes it
# size = 13
# text = "#ffffffff"
# dimmed = "#ffffff66"      # typed letters, a verb's name, a placeholder
# background = "#1e1e2ef0"
# border = "#d0d0d0ff"
# border_width = 1
# radius = 4
# padding = [2, 5]          # vertical, horizontal
# position = "bottom-right" # on the target: center, top, bottom, left, right, or a corner as top-left
# offset = [0, 0]           # px from there, right and down
# case = "upper"            # the tags' letters: upper or lower; the keys are the same

[style.leader]
# The line from a tag to the dot where it clicks: shown when an arrow moves
# a click, or when a tag had to move off its target to stay readable. Each
# is drawn inside an outline, so it shows on light and dark windows alike.
# Unset colours follow the tags: the line and dot take [style] text, the
# outline takes [style] background.
# line = "#ffffffff"
# dot = "#ffffffff"
# outline = "#1e1e2ef0"
# width = 1                 # the line's, in px
# radius = 3                # the dot's, in px
# outline_width = 2         # px, around the dot and across the line; 0 for none

[style.pixels]
# Tags found in a window's pixels ([pixels] detector) are guesses and miss
# more often than tags from the accessibility tree; this look tells them
# apart. Unset fields follow [style]; by default only the letters differ.
# font = "sans-serif:bold"
# size = 13
# text = "#94e2d5ff"        # teal
# dimmed = "#ffffff66"
# background = "#1e1e2ef0"
# border = "#d0d0d0ff"
# border_width = 1
# radius = 4
# padding = [2, 5]          # vertical, horizontal


[input]
# The box for what you type: an armed verb's name, "drop" while a hold is
# down, the tag letters typed so far, and text mode's query. [info]'s
# messages are its second line. Once called [text.input], which a file may
# still say. Unset look fields follow [style]; position and offset are on
# the screen here.
# visible = true            # false hides the first line; a listening bar still gets it (README: "The input box in a bar")
# hints = true              # typed tag letters show here, and leave the tags; false dims them on the tags
# placeholder = "text"      # shown, dimmed, while nothing is typed in text mode
# prefix = ""               # before the query, as "find: "
# suffix = ""               # after the query, before the match count
# font = "sans-serif:bold"
# size = 13
# text = "#ffffffff"
# dimmed = "#ffffff66"      # the armed verb's name and the placeholder
# background = "#1e1e2ef0"
# border = "#d0d0d0ff"
# border_width = 1
# radius = 4
# padding = [2, 5]          # vertical, horizontal
# position = "bottom"       # on the screen: center, top, bottom, left, right, or a corner as top-left
# offset = [0, -48]         # px from there, right and down


[info]
# What wayhint has to say, as the input box's second line: an icon and a
# few words in the message's colour, at most two lines. Each kind of
# message can be turned off.
# visible = true            # false hides the messages; a listening bar still gets them
# scanning = true           # "scanning" once a scan takes over half a second
# no_targets = true         # "no targets" while nothing on the monitor has a tag
# no_match = true           # named here: a key that matches no tag (dropped), or text nothing matches
# duration = 2000           # ms a message stays
# icon_font = "Symbols Nerd Font"  # a fontconfig pattern; icons it lacks are left out
# Each message's icon, one glyph or "" for none, and its colour.
# scanning_icon = "\uF002"   # nf-fa-search
# scanning_color = "#89b4faff"
# no_targets_icon = "\uF05E" # nf-fa-ban
# no_targets_color = "#f9e2afff"
# no_match_icon = "\uF057"   # nf-fa-times_circle
# no_match_color = "#f38ba8ff"
# help_icon = "\uF11C"       # nf-fa-keyboard: the key list
# help_color = "#b4befeff"


[text]
# Text mode is a run of its own, `wayhint --text`, on a compositor shortcut
# beside plain `wayhint` for tags; launching one closes the other.
# Typing finds text on screen from the start of a word, Enter acts on the
# current match, Tab and the arrows move between matches. Targets with no
# text to type keep a tag. A verb goes first, before the text, and
# Backspace with nothing typed takes it back; the close key leaves wayhint.
# cursor = "center"         # start, center or end of the selected match
# Start uses the first visible line's left edge; end uses the last visible
# line's rightmost pixel. Center uses the middle of the first visible line.
# auto_accept = false       # act on the only match left, once 3 characters are typed; false requires Enter
# The former name, pick_unique, still works. Tags here use [hints] auto_accept.
# hints = true              # tags on the targets with no text to type, in letters no word on screen starts with

[text.matches]
# The box over every match. Unset radius and padding follow [style].
# background = "#ffff0080"
# border = "#d0d0d0ff"
# border_width = 0
# radius = 4
# padding = [2, 5]          # vertical, horizontal

[text.matches.current]
# The box over the selected match. Unset fields follow [text.matches], in orange.
# background = "#ff963280"
# border = "#d0d0d0ff"
# border_width = 0
# radius = 4
# padding = [2, 5]          # vertical, horizontal


[pointer]
# after = "restore"         # the cursor goes back after a click; "leave" keeps it on the target
# nudge = 10                # px one arrow press moves a click; held, it goes on, faster
# scroll = 5                # wheel notches one scroll_up or scroll_down turns
# settle = 150              # ms the app gets to react to a click before the windows are read again; raise it for slow menus


[pixels]
# Windows with no accessibility tree get tags found in their pixels.
# detector = "full"         # "full", "fast" for slower CPUs, or "off"
# One focus tag per terminal, independent of detector, including when it is off.
# Kitty uses its active text cursor through remote control; other terminals
# use a patch near the bottom-right corner.
# terminal_hint = true
# Programs read as terminals (input areas, not buttons). Setting it replaces
# the whole list; [] turns terminal detection off.
# terminal_processes = ["kitty", "foot", "footclient", "alacritty", "ghostty", "com.mitchellh.ghostty", "wezterm", "wezterm-gui", "org.wezfurlong.wezterm", "xterm"]


[scan]
# refresh = 500             # ms the tags stay up before the windows are scanned again; 0 for only after a click
# merge_distance = 0        # px between hint centres that share one tag; 0 keeps every hint
