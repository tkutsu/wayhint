# Wayhint defaults. Uncomment only the settings you want to change.
# `wayhint config` validates your file and prints the effective settings.
# Colors accept #RGB, #RGBA, #RRGGBB or #RRGGBBAA. Alpha controls opacity.
# Sizes and distances are logical pixels; settings ending in _ms use milliseconds.

[keys]
# Keys use their positions in your keyboard's first layout.
# The alphabet is ordered from easiest to press to hardest.
# alphabet = "asdfghjkl"
# default_action = "left"   # action for a bare tag or Space
# Shortcut values are a key or false (disabled). Omit to use the default.
# Verbs accept capitals, symbols or named keys. Shift belongs to the key.
# left = false
# right = ","
# middle = "/"
# double = "."
# hover = "'"
# back = "Home"
# forward = "End"
# scroll_up = "PageUp"
# scroll_down = "PageDown"
# hold = ";"               # the next tag or Space releases on that target
# repeat = false           # repeat the last command on its target
# help = "?"
# close = "Esc"            # cannot be disabled; can override a built-in key

# Optional alternate keys for tag letters: "key" = "letter".
# [keys.aliases]
# ";" = "c"

[hints]
# auto_accept = true       # false waits for Enter after a completed tag
# window_hint = true       # focus each window; top-right label, no arrow, hidden with any verb
# font = "sans-serif:bold" # fontconfig pattern
# size = 13
# text = "#ffffffff"
# text_end = "#ffffffff"   # omit for solid text
# text_direction = "right"
# dimmed = "#ffffff66"     # typed letters
# verb = "#fab387ff"
# background = "#1e1e2ef0"
# background_end = "#1e1e2ef0" # omit for a solid background
# background_direction = "right"
# Gradients span each monitor. Directions: left, right, top, bottom, or a corner.
# border = "#d0d0d0ff"
# border_width = 1
# radius = 4
# padding = [2, 5]         # vertical, horizontal
# position = "auto"        # beside the target, avoiding other controls
# Other positions: center, top, bottom, left, right, or a corner such as top-left.
# offset = [0, 0]          # right, down
# case = "upper"           # upper or lower; does not change the keys

[hints.arrow]
# color = "#ffffffff"      # follows hints.text
# outline = "#1e1e2ef0"    # follows hints.background
# length = 3              # 0 hides arrows
# outline_width = 2        # 0 removes the outline

[hints.pixels]
# Pixel hints inherit [hints], with teal text unless a shared text gradient is set.
# font = "sans-serif:bold"
# size = 13
# text = "#94e2d5ff"       # an explicit color replaces the shared text gradient
# dimmed = "#ffffff66"
# verb = "#fab387ff"
# background = "#1e1e2ef0" # an explicit color replaces the shared background gradient
# border = "#d0d0d0ff"
# border_width = 1
# radius = 4
# padding = [2, 5]

[words]
# cursor = "center"        # start, center or end of the selected match
# auto_accept = false      # true acts on a unique match after 3 typed characters
# fallback_hints = true    # tags for targets without searchable text

[words.matches]
# Match boxes inherit radius and padding from [hints].
# background = "#ffff0080"
# background_end = "#ffff0080" # omit for a solid background
# background_direction = "right"
# border = "#d0d0d0ff"
# border_width = 0
# radius = 4
# padding = [2, 5]

[words.matches.current]
# Inherits [words.matches], with an orange starting color.
# An explicit background replaces the inherited gradient unless background_end is set.
# background = "#ff963280"
# background_end = "#ff963280"
# background_direction = "right"
# border = "#d0d0d0ff"
# border_width = 0
# radius = 4
# padding = [2, 5]

[words.first_character]
# First letters are marked while no query is typed.
# mark = "off"             # off, underline, box or dot
# color = "#89b4faff"       # fill for every shape; use alpha for a translucent box
# color_end = "#89b4faff"   # omit for a solid fill
# direction = "right"      # gradient direction across each monitor
# thickness = 2            # underline height or dot diameter; dot sits 1 px below
# These fields apply only to boxes:
# border = "#89b4faff"
# border_width = 0
# radius = 2
# padding = [0, 1]

[input]
# The input box inherits its appearance from [hints], with its own screen position.
# visible = true           # false hides it; a listening bar still receives updates
# show_typed_hints = true  # show typed tag letters here and remove them from tags
# placeholder = "text"
# prefix = ""
# suffix = ""
# font = "sans-serif:bold"
# size = 13
# text = "#ffffffff"
# dimmed = "#ffffff66"     # placeholder color
# verb = "#fab387ff"
# background = "#1e1e2ef0"
# border = "#d0d0d0ff"
# border_width = 1
# radius = 4
# padding = [2, 5]
# position = "bottom"      # screen position; same choices as hints, except auto
# offset = [0, -48]

[messages]
# Status messages appear below the input. Visibility is independent of [input].
# visible = true           # false hides them; a listening bar still receives updates
# scanning = true
# no_targets = true
# no_match = true
# duration_ms = 2000
# icon_font = "Symbols Nerd Font"
# scanning_icon = "\uF002" # use "" for no icon
# scanning_color = "#89b4faff"
# no_targets_icon = "\uF05E"
# no_targets_color = "#f9e2afff"
# no_match_icon = "\uF057"
# no_match_color = "#f38ba8ff"
# help_icon = "\uF11C"
# help_color = "#b4befeff"

[pointer]
# after = "leave"          # restore returns the pointer after a click
# nudge_px = 10            # distance per arrow press; holding accelerates
# scroll_steps = 5         # wheel notches per scroll action
# settle_ms = 150          # wait after acting before reading windows again

[pixels]
# detector = "full"        # full, fast (for slower CPUs), or off
# terminal_hint = false    # terminal cursor/fallback tag, independent of window hints and detector
# terminal_processes = ["kitty", "foot", "footclient", "alacritty", "ghostty", "com.mitchellh.ghostty", "wezterm", "wezterm-gui", "org.wezfurlong.wezterm", "xterm"]
# Setting terminal_processes replaces the list; [] disables terminal detection.

[scan]
# refresh_ms = 500         # doubles up to 2 s when idle; 0 scans only after actions
# merge_distance_px = 0    # 0 keeps every hint; otherwise merge nearby centers
